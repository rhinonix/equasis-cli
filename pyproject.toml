[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equasis-cli"
dynamic = ["version"]
description = "Command-line access to Equasis maritime data: vessel profiles, PSC inspections, ownership history, and fleets"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{ name = "rhinonix", email = "rhinonix.github.exclaim769@slmail.me" }]
keywords = [
    "equasis",
    "maritime",
    "shipping",
    "vessel",
    "imo",
    "port-state-control",
    "osint",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "prompt_toolkit>=3.0.43",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "twine>=5.1",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/rhinonix/equasis-cli"
Issues = "https://github.com/rhinonix/equasis-cli/issues"
Changelog = "https://github.com/rhinonix/equasis-cli/blob/main/CHANGELOG.md"

[project.scripts]
equasis = "equasis_cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "equasis_cli._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equasis_cli = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Legacy modules are excluded until they are rewritten in the core reliability
# refactor; new and rewritten code must pass the full rule set.
extend-exclude = [
    "src/equasis_cli/banner.py",
    "src/equasis_cli/client.py",
    "src/equasis_cli/credentials.py",
    "src/equasis_cli/formatter.py",
    "src/equasis_cli/interactive.py",
    "src/equasis_cli/main.py",
    "src/equasis_cli/parser.py",
    "src/equasis_cli/__init__.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src/equasis_cli"]

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: exercises the real equasis.org service (set EQUASIS_LIVE_TESTS=1 and credentials)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["equasis_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
