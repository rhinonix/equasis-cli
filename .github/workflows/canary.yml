name: Live canary

# Runs the live test suite against equasis.org once a week to detect website
# changes before users do. Requires the repository secrets EQUASIS_USERNAME and
# EQUASIS_PASSWORD; without them the job is skipped.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live Equasis checks
    runs-on: ubuntu-latest
    env:
      EQUASIS_USERNAME: ${{ secrets.EQUASIS_USERNAME }}
      EQUASIS_PASSWORD: ${{ secrets.EQUASIS_PASSWORD }}
      EQUASIS_LIVE_TESTS: "1"
    steps:
      - name: Check for credentials
        id: credentials
        run: |
          if [ -n "$EQUASIS_USERNAME" ] && [ -n "$EQUASIS_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EQUASIS_USERNAME and EQUASIS_PASSWORD secrets are not set; skipping."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run live tests
        if: steps.credentials.outputs.available == 'true'
        run: pytest tests/test_live.py -v
