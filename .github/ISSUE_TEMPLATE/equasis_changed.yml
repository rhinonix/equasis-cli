name: Equasis page changed
description: Exit code 6, "could not read the Equasis page", or data that is missing or in the wrong fields
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Equasis sometimes changes its website, which can break parsing. A copy of the page
        makes this quick to fix.

        1. Re-run the failing command with `--save-html pages --refresh`.
        2. Open the saved page for the failing request in a text editor and replace your
           name in the "Welcome" section with `Test User`.
        3. Attach the edited page below.
  - type: input
    id: version
    attributes:
      label: equasis-cli version
      description: Output of `equasis --version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: text
    validations:
      required: true
  - type: textarea
    id: page
    attributes:
      label: Saved page (with your name removed)
      description: Drag the HTML file here, or describe what looks different on equasis.org.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my name from any attached page
          required: true
